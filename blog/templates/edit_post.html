<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Post</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="{% url 'home' %}">
                My Blog Platform
            </a>

        </div>

    </nav>

    <!-- Main Container -->
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow border-0">

                    <div class="card-body p-5">

                        <h1 class="text-center mb-4 fw-bold">
                            Edit Blog Post
                        </h1>

                        <!-- Form -->
                        <form method="POST"
                              enctype="multipart/form-data">

                            {% csrf_token %}

                            <!-- Title -->
                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Title
                                </label>

                                <input type="text"
                                       name="title"
                                       class="form-control"
                                       value="{{ post.title }}"
                                       required>

                            </div>

                            <!-- Content -->
                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Content
                                </label>

                                <textarea name="content"
                                          class="form-control"
                                          rows="6"
                                          required>{{ post.content }}</textarea>

                            </div>

                            <!-- Current Image -->
                            {% if post.image %}

                            <div class="mb-4">

                                <label class="form-label fw-bold">
                                    Current Image
                                </label>

                                <br>

                                <img src="{{ post.image.url }}"
                                     class="img-fluid rounded shadow-sm"
                                     style="max-height:300px;">

                            </div>

                            {% endif %}

                            <!-- Upload New Image -->
                            <div class="mb-4">

                                <label class="form-label fw-bold">
                                    Change Image
                                </label>

                                <input type="file"
                                       name="image"
                                       class="form-control">

                            </div>

                            <!-- Buttons -->
                            <div class="d-flex justify-content-between">

                                <a href="{% url 'home' %}"
                                   class="btn btn-secondary">
                                    Back
                                </a>

                                <button type="submit"
                                        class="btn btn-success">
                                    Update Post
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
