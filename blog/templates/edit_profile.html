<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background-color: #f5f5f5;
        }

        .profile-card {
            border-radius: 20px;
        }

        .profile-preview {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border: 4px solid #198754;
        }

    </style>

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

        <div class="container">

            <a href="{% url 'home' %}"
               class="navbar-brand fw-bold">

                My Blog Platform

            </a>

            <div>

                <a href="{% url 'profile' %}"
                   class="btn btn-outline-light btn-sm">

                    My Profile

                </a>

            </div>

        </div>

    </nav>

    <!-- Main Container -->
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow border-0 profile-card">

                    <div class="card-body p-5">

                        <!-- Heading -->
                        <div class="text-center mb-5">

                            <h1 class="fw-bold">

                                Edit Profile

                            </h1>

                            <p class="text-muted">

                                Update your personal information

                            </p>

                        </div>

                        <!-- Current Profile Image -->
                        <div class="text-center mb-4">

                            {% if profile.profile_image %}

                            <img src="{{ profile.profile_image.url }}"
                                 class="rounded-circle profile-preview shadow">

                            {% else %}

                            <img src="https://via.placeholder.com/140"
                                 class="rounded-circle profile-preview shadow">

                            {% endif %}

                        </div>

                        <!-- Form -->
                        <form method="POST"
                              enctype="multipart/form-data">

                            {% csrf_token %}

                            <!-- Username -->
                            <div class="mb-4">

                                <label class="form-label fw-bold">

                                    Username

                                </label>

                                <input type="text"
                                       class="form-control"
                                       value="{{ user.username }}"
                                       disabled>

                            </div>

                            <!-- Email -->
                            <div class="mb-4">

                                <label class="form-label fw-bold">

                                    Email

                                </label>

                                <input type="email"
                                       class="form-control"
                                       value="{{ user.email }}"
                                       disabled>

                            </div>

                            <!-- Bio -->
                            <div class="mb-4">

                                <label class="form-label fw-bold">

                                    Bio / About

                                </label>

                                <textarea name="bio"
                                          class="form-control"
                                          rows="6"
                                          placeholder="Write something about yourself...">{{ profile.bio }}</textarea>

                            </div>

                            <!-- Upload Image -->
                            <div class="mb-4">

                                <label class="form-label fw-bold">

                                    Profile Image

                                </label>

                                <input type="file"
                                       name="profile_image"
                                       class="form-control">

                            </div>

                            <!-- Buttons -->
                            <div class="d-flex justify-content-between mt-5">

                                <a href="{% url 'profile' %}"
                                   class="btn btn-secondary px-4">

                                    Back

                                </a>

                                <button type="submit"
                                        class="btn btn-success px-4">

                                    Save Profile

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
